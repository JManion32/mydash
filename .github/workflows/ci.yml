name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    stylelint:
        name: Stylelint
        runs-on: ubuntu-24.04

        defaults:
            run:
                working-directory: site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run Stylelint
              run: npx stylelint **/*.{css,scss}


    prettier:
        name: Prettier
        runs-on: ubuntu-24.04

        defaults:
            run:
                working-directory: site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run Prettier
              run: npx prettier --check .


    eslint:
        name: ESLint
        runs-on: ubuntu-24.04

        defaults:
            run:
                working-directory: site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npx eslint .

       
    docker-build:
      name: Docker Build Test
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build images
          run: docker compose -f compose.yml build


    docker-publish:
        name: Publish Docker Image
        runs-on: ubuntu-latest
        needs: [stylelint, prettier, eslint, docker-build]

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push site
              uses: docker/build-push-action@v5
              with:
                  context: ./site
                  file: ./site/Dockerfile
                  push: true
                  tags: ghcr.io/jmanion32/mydash-site:latest

            - name: Build and push api
              uses: docker/build-push-action@v5
              with:
                  context: ./server
                  file: ./server/Dockerfile
                  push: true
                  tags: ghcr.io/jmanion32/mydash-server:latest


    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: docker-publish

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Deploy to droplet
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: root
                  key: ${{ secrets.DROPLET_SSH_KEY }}
                  script: |
                      cd ~/prod
                      docker compose -f compose.prod.yml pull
                      docker compose -f compose.prod.yml up -d
                      docker image prune -af