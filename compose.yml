services:

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  server:
    build: ./server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./server:/app
    restart: always

  site:
    build: ./site
    ports:
      - "5173:5173"
    volumes:
      - ./site:/app

volumes:
  pgdata: