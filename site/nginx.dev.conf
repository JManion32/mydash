# Local development: plain HTTP, no TLS, no redirect.
# Baked into the site image when built with --build-arg NGINX_ENV=dev.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    client_max_body_size 1M;

    # Proxy /api/* to the backend service on the compose network.
    # Public path is /api; "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts so a debugger breakpoint doesn't produce a 504
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Never cache the SPA shell locally, so a rebuild shows up immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Serve frontend SPA
    location / {
        try_files $uri /index.html;
    }
}
