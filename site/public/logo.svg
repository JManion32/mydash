<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Concentric rings converging inward — the sense of narrowing focus,
       settling, "locking in" on the center. Generous, filled use of space. -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#1e3a5f" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2c5a8f" stroke-width="30"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#3b82f6" stroke-width="26"/>

  <!-- The lock point -->
  <circle cx="256" cy="256" r="46" fill="url(#core)"/>
</svg>
